<!DOCTYPE html>
<html lang="en">
<head>
<script src="../gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Entity Records — DripJobs</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ══════════════════════════════════════════════
     PROTO BAR (hub chrome — DM Sans, matches hub)
     ══════════════════════════════════════════════ */
  :root {
    --color-primary:        #8B85EA;
    --color-primary-hover:  #736BE3;
    --color-primary-active: #5C53DC;
    --color-primary-rgb:    139, 133, 234;
    --color-bg:             #F3F1FC;
    --color-text:           #32415B;
    --color-text-muted:     #80879A;
    --color-border:         #DAD8E3;
    --color-card:           #FFFFFF;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--color-bg); color: var(--color-text); }

  .proto-bar {
    background: var(--color-card);
    border-bottom: 1px solid var(--color-border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .proto-bar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .back-link {
    font-size: 12px; font-weight: 500; color: var(--color-text-muted);
    text-decoration: none; display: flex; align-items: center; gap: 4px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--color-primary); }
  .divider { color: var(--color-border); font-size: 16px; }
  .proto-bar-title { font-size: 14px; font-weight: 600; }
  .proto-bar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .proto-bar-pill {
    font-size: 11px; font-weight: 600; color: var(--color-primary-active);
    padding: 4px 10px; border: 1px solid #D6D2F5; background: #E8E6FA;
    border-radius: 999px; letter-spacing: 0.2px; text-decoration: none;
  }
  .proto-bar-pill.muted { color: var(--color-text-muted); background: #F3F1FC; border-color: var(--color-border); }
  .proto-bar-pill:hover { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
  .proto-bar-pill.muted:hover { background: #F3F1FC; color: var(--color-text-muted); }
  .guide-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: #fff; background: var(--color-primary);
    border: none; padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .guide-btn:hover { background: var(--color-primary-hover); }

  /* ══════════════════════════════════════════════
     APP SHELL — Nunito, in-app soft purple #8B85EA (design system --st-color-primary,
     not the #7C3AED marketing brand purple — this surface is in-product chrome)
     ══════════════════════════════════════════════ */
  #be-app {
    /* Contrast flag (Notes tab a11y pass): white text on --purple (.btn-primary) and on --red/white
       on --red (.btn-danger) both read ~3.1-3.8:1 against their backgrounds, below the 4.5:1 AA floor
       for normal text. Both are pre-existing, global components used throughout this whole prototype,
       not something newly introduced here, so left unchanged per brief ("don't change existing
       elements"), flagged for a follow-up design-system pass instead of a one-off patch. */
    --purple: #8B85EA;
    --purple-hover: #736BE3;
    --purple-light: #E8E6FA;
    --purple-dark: #5C53DC;
    --teal: #0DCECE;
    --green: #10B981;
    --green-light: #D1FAE5;
    --red: #EF4444;
    --red-light: #FEE2E2;
    --amber: #D97706;
    --amber-light: #FFFBEB;
    --amber-border: #FDE68A;
    --gray-50: #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-300: #D1D5DB;
    --gray-400: #9CA3AF;
    --gray-500: #6B7280;
    --gray-600: #4B5563;
    --gray-700: #374151;
    --gray-800: #1F2937;
    --gray-900: #111827;
    --sidebar-w: 224px;
    --radius: 10px;
    --radius-sm: 8px;
    --shadow-md: 0 4px 16px rgba(17,24,39,0.10);
    --shadow-lg: 0 12px 32px rgba(17,24,39,0.16);

    font-family: 'Nunito', sans-serif;
    color: var(--gray-800);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    height: calc(100vh - 57px);
    min-height: 640px;
    background: var(--gray-50);
    border-top: 1px solid var(--color-border);
  }
  #be-app * { box-sizing: border-box; }
  #be-app button, #be-app input, #be-app select, #be-app textarea { font-family: inherit; }

  /* ─── Sidebar ─── */
  #be-app .sidebar {
    width: var(--sidebar-w);
    background: #fff;
    border-right: 1px solid var(--gray-200);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  #be-app .sidebar-logo {
    display: flex; align-items: center; gap: 9px;
    padding: 16px 16px 12px;
  }
  #be-app .logo-mark {
    width: 28px; height: 28px; background: var(--purple); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 800; flex-shrink: 0;
  }
  #be-app .logo-text { font-size: 16px; font-weight: 800; color: var(--gray-900); }
  #be-app .sidebar-workspace {
    display: flex; align-items: center; gap: 7px;
    margin: 0 12px 10px; padding: 8px 10px; border-radius: 8px; background: var(--gray-50);
    font-size: 12.5px; font-weight: 700; color: var(--gray-700);
  }
  #be-app .sidebar-workspace svg { color: var(--gray-400); flex-shrink: 0; }
  #be-app .sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  #be-app .sidebar-section { padding: 8px 0; border-top: 1px solid var(--gray-100); }
  #be-app .sidebar-section:first-child { border-top: none; }
  #be-app .sidebar-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--gray-400); padding: 4px 16px 6px;
  }
  #be-app .sidebar-item {
    display: flex; align-items: center; gap: 10px;
    margin: 1px 8px; padding: 8px 10px; border-radius: 8px;
    color: var(--gray-600); font-weight: 700; font-size: 13.5px;
    cursor: pointer; position: relative; transition: background 0.15s, color 0.15s;
  }
  #be-app .sidebar-item:hover { background: var(--gray-50); color: var(--gray-800); }
  #be-app .sidebar-item.active { background: var(--purple); color: #fff; }
  #be-app .sidebar-item.active .sidebar-chevron { color: rgba(255,255,255,0.7); }
  #be-app .sidebar-icon { width: 16px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--gray-500); }
  #be-app .sidebar-item.active .sidebar-icon { color: #fff; }
  #be-app .sidebar-new-badge {
    margin-left: auto; background: var(--green); color: #fff; font-size: 9px; font-weight: 800;
    padding: 2px 6px; border-radius: 20px; letter-spacing: 0.3px;
  }
  #be-app .sidebar-count-badge {
    margin-left: auto; background: var(--purple-light); color: var(--purple-dark); font-size: 9.5px; font-weight: 800;
    padding: 2px 7px; border-radius: 20px; white-space: nowrap;
  }
  #be-app .sidebar-item.active .sidebar-count-badge { background: rgba(255,255,255,0.25); color: #fff; }
  #be-app .sidebar-chevron { margin-left: auto; color: var(--gray-300); flex-shrink: 0; }
  #be-app .sidebar-settings {
    border-top: 1px solid var(--gray-100); border-radius: 0; margin: 0; padding: 12px 24px;
  }
