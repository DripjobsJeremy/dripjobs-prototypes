<!DOCTYPE html>
<html lang="en">
<head>
<script src="../gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Entity Records — DripJobs</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ══════════════════════════════════════════════
     PROTO BAR (hub chrome — DM Sans, matches hub)
     ══════════════════════════════════════════════ */
  :root {
    --color-primary:        #8B85EA;
    --color-primary-hover:  #736BE3;
    --color-primary-active: #5C53DC;
    --color-primary-rgb:    139, 133, 234;
    --color-bg:             #F3F1FC;
    --color-text:           #32415B;
    --color-text-muted:     #80879A;
    --color-border:         #DAD8E3;
    --color-card:           #FFFFFF;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--color-bg); color: var(--color-text); }

  .proto-bar {
    background: var(--color-card);
    border-bottom: 1px solid var(--color-border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .proto-bar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .back-link {
    font-size: 12px; font-weight: 500; color: var(--color-text-muted);
    text-decoration: none; display: flex; align-items: center; gap: 4px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--color-primary); }
  .divider { color: var(--color-border); font-size: 16px; }
  .proto-bar-title { font-size: 14px; font-weight: 600; }
  .proto-bar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .proto-bar-pill {
    font-size: 11px; font-weight: 600; color: var(--color-primary-active);
    padding: 4px 10px; border: 1px solid #D6D2F5; background: #E8E6FA;
    border-radius: 999px; letter-spacing: 0.2px; text-decoration: none;
  }
  .proto-bar-pill.muted { color: var(--color-text-muted); background: #F3F1FC; border-color: var(--color-border); }
  .proto-bar-pill:hover { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
  .proto-bar-pill.muted:hover { background: #F3F1FC; color: var(--color-text-muted); }
  .guide-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: #fff; background: var(--color-primary);
    border: none; padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .guide-btn:hover { background: var(--color-primary-hover); }

  /* ══════════════════════════════════════════════
     APP SHELL — Nunito, in-app soft purple #8B85EA (design system --st-color-primary,
     not the #7C3AED marketing brand purple — this surface is in-product chrome)
     ══════════════════════════════════════════════ */
  #be-app {
    /* Contrast flag (Notes tab a11y pass): white text on --purple (.btn-primary) and on --red/white
       on --red (.btn-danger) both read ~3.1-3.8:1 against their backgrounds, below the 4.5:1 AA floor
       for normal text. Both are pre-existing, global components used throughout this whole prototype,
       not something newly introduced here, so left unchanged per brief ("don't change existing
       elements"), flagged for a follow-up design-system pass instead of a one-off patch. */
    --purple: #8B85EA;
    --purple-hover: #736BE3;
    --purple-light: #E8E6FA;
    --purple-dark: #5C53DC;
    --teal: #0DCECE;
    --green: #10B981;
    --green-light: #D1FAE5;
    --red: #EF4444;
    --red-light: #FEE2E2;
    --amber: #D97706;
    --amber-light: #FFFBEB;
    --amber-border: #FDE68A;
    --gray-50: #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-300: #D1D5DB;
    --gray-400: #9CA3AF;
    --gray-500: #6B7280;
    --gray-600: #4B5563;
    --gray-700: #374151;
    --gray-800: #1F2937;
    --gray-900: #111827;
    --sidebar-w: 224px;
    --radius: 10px;
    --radius-sm: 8px;
    --shadow-md: 0 4px 16px rgba(17,24,39,0.10);
    --shadow-lg: 0 12px 32px rgba(17,24,39,0.16);

    font-family: 'Nunito', sans-serif;
    color: var(--gray-800);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    height: calc(100vh - 57px);
    min-height: 640px;
    background: var(--gray-50);
    border-top: 1px solid var(--color-border);
  }
  #be-app * { box-sizing: border-box; }
  #be-app button, #be-app input, #be-app select, #be-app textarea { font-family: inherit; }

  /* ─── Sidebar ─── */
  #be-app .sidebar {
    width: var(--sidebar-w);
    background: #fff;
    border-right: 1px solid var(--gray-200);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  #be-app .sidebar-logo {
    display: flex; align-items: center; gap: 9px;
    padding: 16px 16px 12px;
  }
  #be-app .logo-mark {
    width: 28px; height: 28px; background: var(--purple); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 800; flex-shrink: 0;
  }
  #be-app .logo-text { font-size: 16px; font-weight: 800; color: var(--gray-900); }
  #be-app .sidebar-workspace {
    display: flex; align-items: center; gap: 7px;
    margin: 0 12px 10px; padding: 8px 10px; border-radius: 8px; background: var(--gray-50);
    font-size: 12.5px; font-weight: 700; color: var(--gray-700);
  }
  #be-app .sidebar-workspace svg { color: var(--gray-400); flex-shrink: 0; }
  #be-app .sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  #be-app .sidebar-section { padding: 8px 0; border-top: 1px solid var(--gray-100); }
  #be-app .sidebar-section:first-child { border-top: none; }
  #be-app .sidebar-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--gray-400); padding: 4px 16px 6px;
  }
  #be-app .sidebar-item {
    display: flex; align-items: center; gap: 10px;
    margin: 1px 8px; padding: 8px 10px; border-radius: 8px;
    color: var(--gray-600); font-weight: 700; font-size: 13.5px;
    cursor: pointer; position: relative; transition: background 0.15s, color 0.15s;
  }
  #be-app .sidebar-item:hover { background: var(--gray-50); color: var(--gray-800); }
  #be-app .sidebar-item.active { background: var(--purple); color: #fff; }
  #be-app .sidebar-item.active .sidebar-chevron { color: rgba(255,255,255,0.7); }
  #be-app .sidebar-icon { width: 16px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--gray-500); }
  #be-app .sidebar-item.active .sidebar-icon { color: #fff; }
  #be-app .sidebar-new-badge {
    margin-left: auto; background: var(--green); color: #fff; font-size: 9px; font-weight: 800;
    padding: 2px 6px; border-radius: 20px; letter-spacing: 0.3px;
  }
  #be-app .sidebar-count-badge {
    margin-left: auto; background: var(--purple-light); color: var(--purple-dark); font-size: 9.5px; font-weight: 800;
    padding: 2px 7px; border-radius: 20px; white-space: nowrap;
  }
  #be-app .sidebar-item.active .sidebar-count-badge { background: rgba(255,255,255,0.25); color: #fff; }
  #be-app .sidebar-chevron { margin-left: auto; color: var(--gray-300); flex-shrink: 0; }
  #be-app .sidebar-settings {
    border-top: 1px solid var(--gray-100); border-radius: 0; margin: 0; padding: 12px 24px;
  }

  /* ─── Global top bar (search + notifications + user menu) ─── */
  #be-app .global-topbar {
    height: 60px; background: #fff; border-bottom: 1px solid var(--gray-200);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 0 24px; flex-shrink: 0;
  }
  #be-app .global-search-wrap { position: relative; width: 100%; max-width: 340px; }
  #be-app .global-search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
  #be-app .global-search-input {
    width: 100%; height: 38px; padding: 0 12px 0 34px; border: 1.5px solid var(--gray-200);
    border-radius: 8px; font-size: 13px; background: var(--gray-50); color: var(--gray-700);
  }
  #be-app .global-search-input::placeholder { color: var(--gray-400); }
  #be-app .global-search-input:focus { outline: none; border-color: var(--purple); background: #fff; }
  #be-app .global-topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  #be-app .icon-btn {
    width: 34px; height: 34px; border-radius: 8px; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; position: relative;
    color: var(--gray-500); cursor: pointer;
  }
  #be-app .icon-btn:hover { background: var(--gray-50); }
  #be-app .icon-btn.alert { color: var(--amber); }
  #be-app .notif-dot { position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 1.5px solid #fff; }
  #be-app .user-menu { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: 999px; cursor: pointer; margin-left: 4px; }
  #be-app .user-menu:hover { background: var(--gray-50); }
  #be-app .user-avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--gray-900); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; flex-shrink: 0;
  }
  #be-app .user-name { font-size: 13px; font-weight: 700; color: var(--gray-800); white-space: nowrap; }
  #be-app .user-menu svg { color: var(--gray-400); flex-shrink: 0; }

  /* ─── Main / topbar ─── */
  #be-app .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #be-app .topbar {
    height: 58px; background: #fff; border-bottom: 1px solid var(--gray-200);
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0;
  }
  #be-app .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #be-app .page-title { font-size: 18px; font-weight: 800; color: var(--gray-900); white-space: nowrap; }
  #be-app .breadcrumb-link {
    font-size: 13px; font-weight: 700; color: var(--gray-400); cursor: pointer; white-space: nowrap;
  }
  #be-app .breadcrumb-link:hover { color: var(--purple); }
  #be-app .breadcrumb-sep { color: var(--gray-300); }
  #be-app .topbar-right { display: flex; align-items: center; gap: 10px; }

  #be-app .content-scroll { flex: 1; overflow-y: auto; padding: 22px 24px 60px; }
  #be-app .view { display: none; }
  #be-app .view.active { display: block; }

  /* ─── Buttons (app-shell) ─── */
  #be-app .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 16px; border-radius: var(--radius-sm);
    font-size: 13.5px; font-weight: 700; cursor: pointer; border: none;
    transition: all 0.15s; white-space: nowrap;
  }
  #be-app .btn-primary { background: var(--purple); color: #fff; }
  #be-app .btn-primary:hover { background: var(--purple-hover); }
  #be-app .btn-outline { background: #fff; color: var(--gray-700); border: 1.5px solid var(--gray-300); }
  #be-app .btn-outline:hover { border-color: var(--purple); color: var(--purple); }
  #be-app .btn-danger { background: #fff; color: var(--red); border: 1.5px solid #FCA5A5; }
  #be-app .btn-danger:hover { background: var(--red-light); }
  #be-app .btn-danger.solid { background: var(--red); color: #fff; border-color: var(--red); }
  #be-app .btn-danger.solid:hover { background: #DC2626; }
  #be-app .btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 7px; }
  #be-app .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #be-app .btn-link {
    background: none; border: none; color: var(--purple); font-weight: 700; font-size: 12.5px;
    cursor: pointer; padding: 0; text-decoration: none;
  }
  #be-app .btn-link:hover { text-decoration: underline; }
  #be-app .btn-link.muted { color: var(--gray-500); }

  /* ─── Toolbar row ─── */
  #be-app .toolbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  #be-app .search-input-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
  #be-app .search-input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); }
  #be-app .search-input {
    width: 100%; height: 38px; padding: 0 12px 0 34px; border: 1.5px solid var(--gray-300);
    border-radius: var(--radius-sm); font-size: 13.5px; background: #fff;
  }
  #be-app .search-input:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(139,133,234,0.18); }
  #be-app select.filter-select {
    height: 38px; padding: 0 30px 0 12px; border: 1.5px solid var(--gray-300); border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 700; color: var(--gray-700); background: #fff; cursor: pointer;
  }
  #be-app select.filter-select:focus { outline: none; border-color: var(--purple); }
  #be-app .toolbar-spacer { flex: 1; }

  /* ─── Contact List page header (matches production: heading + count, actions row) ─── */
  #be-app .list-header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  #be-app .list-heading { font-size: 20px; font-weight: 800; color: var(--gray-900); margin: 0; }
  #be-app .list-heading-count { font-size: 14px; font-weight: 700; color: var(--gray-400); }
  #be-app .list-header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ─── Data table ─── */
  #be-app .table-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); overflow: hidden; }
  #be-app .table-scroll { overflow-x: auto; }
  #be-app table.data-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  #be-app table.data-table thead th {
    text-align: left; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--gray-400); padding: 11px 16px; border-bottom: 1px solid var(--gray-200); white-space: nowrap; background: var(--gray-50);
  }
  #be-app table.data-table thead th.sortable { cursor: pointer; user-select: none; }
  #be-app table.data-table thead th.sortable:hover { color: var(--gray-600); }
  #be-app .sort-arrow { display: inline-block; font-size: 9px; margin-left: 2px; color: var(--gray-300); opacity: 0; transition: opacity 0.1s ease; }
  #be-app table.data-table thead th.sortable:hover .sort-arrow { opacity: 1; }
  #be-app .sort-arrow.active { color: var(--purple); opacity: 1; }
  #be-app table.data-table tbody td { padding: 12px 16px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); vertical-align: middle; }
  #be-app table.data-table tbody tr:last-child td { border-bottom: none; }
  #be-app table.data-table tbody tr:nth-child(even) { background: var(--gray-50); }
  #be-app table.data-table tbody tr.clickable { cursor: pointer; }
  #be-app table.data-table tbody tr.clickable:hover { background: var(--purple-light); }
  #be-app .cell-name { font-weight: 700; color: var(--gray-900); }
  #be-app .cell-muted { color: var(--gray-400); }
  #be-app .cell-created-abs { color: var(--gray-700); }
  #be-app .cell-created-rel { font-size: 11px; color: var(--gray-400); margin-top: 1px; }
